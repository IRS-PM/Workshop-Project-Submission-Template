[project]
name = "remy-backend"
version = "0.1.0"
description = "Remy auth API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "argon2-cffi>=23.1,<26",
    "asyncpg>=0.30,<0.31",
    "fastapi>=0.115,<1",
    "pyjwt>=2.9,<3",
    "python-dotenv>=1,<2",
    "uvicorn[standard]>=0.30,<1",
]

[project.scripts]
remy-backend = "main:run"

[dependency-groups]
dev = ["httpx>=0.27,<1", "pytest>=8,<9", "pytest-asyncio>=0.24,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src/app", "src/main.py"]
sources = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
