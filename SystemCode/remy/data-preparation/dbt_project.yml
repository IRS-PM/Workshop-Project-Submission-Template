name: remy
version: "1.0.0"
config-version: 2

profile: remy

model-paths: [models]
test-paths: [tests]
seed-paths: [seeds]
macro-paths: [macros]
snapshot-paths: [snapshots]

models:
  remy:
    +materialized: table
    staging:
      +materialized: table
      +database: lake
      +schema: staging
    mart:
      +materialized: table
      +database: lake
      +schema: mart
    serving:
      +materialized: table
      +database: lake
      +schema: serving
seeds:
  remy:
    +database: lake
    +schema: seed

clean-targets:
  - target
  - dbt_packages
