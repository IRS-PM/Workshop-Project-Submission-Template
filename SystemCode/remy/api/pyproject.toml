[project]
name = "remy-api"
version = "0.1.0"
description = "Remy API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "remy-workflows",
    "uvicorn[standard]>=0.30,<1",
]

[tool.uv.sources]
remy-workflows = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api"]
